# Perfil usado pelos testes de integração (@ActiveProfiles("test")).
# O datasource é definido em runtime pelo Testcontainers (AbstractIntegrationTest).

spring.jpa.show-sql=false
spring.flyway.enabled=true

# Chaves RSA GERADAS SÓ PARA TESTE (src/test/resources). Nunca use em produção.
jwt.public_key=classpath:app.pub
jwt.private_key=classpath:app.key

# Admin criado pelo AdminUserConfig na subida do contexto.
# Devem bater com as constantes de AbstractIntegrationTest.
user.email=admin@servicelog.test
user.senha=Admin@123

# E-mail: nenhum SMTP real é usado nos testes
spring.mail.host=localhost
spring.mail.port=3025
spring.mail.username=teste
spring.mail.password=teste
management.health.mail.enabled=false

logging.file.name=target/logs/test.log
