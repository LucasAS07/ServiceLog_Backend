spring.application.name=ServiceLog

spring.datasource.url=jdbc:postgresql://${URL_DATABASE}/servicelog
spring.datasource.username=${USER_DATABASE}
spring.datasource.password=${PASSWORD_DATABASE}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# JPA
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# chaves
jwt.public_key=classpath:app.pub
jwt.private_key=classpath:app.key

# Dados para cria��o do usuario admin
user.email=${EMAIL}
user.senha=${PASSWORD}

# Email
spring.mail.host=smtp.mailgun.org
spring.mail.port=587
spring.mail.username= ${USER_EMAIL}
spring.mail.password= ${PASSWORD_EMAIL}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true